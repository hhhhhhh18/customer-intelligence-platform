# Optional containerised infrastructure.
#
# NOTE: this path was authored but not exercised in the build environment
# because the Docker daemon was unavailable. The verified path is the native
# PostgreSQL cluster managed by scripts/db-start.ps1 (see README §11-13).
services:
  postgres:
    image: postgres:17-alpine
    container_name: cip-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customer_intelligence
    ports:
      - '5433:5432'
    volumes:
      - cip-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d customer_intelligence']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22-alpine
    container_name: cip-api
    working_dir: /app/backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/customer_intelligence?schema=public
      PORT: '4000'
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run db:generate && npm run db:migrate && npm run dev"
    ports:
      - '4000:4000'

  web:
    image: node:22-alpine
    container_name: cip-web
    working_dir: /app/frontend
    depends_on:
      - api
    environment:
      API_PROXY_TARGET: http://api:4000
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - '3000:3000'

volumes:
  cip-pgdata:
